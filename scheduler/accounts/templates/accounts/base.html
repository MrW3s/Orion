<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Orion{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --surface: #fff; --text: #1f2328; --muted: #656d76;
      --border: #d8dee4; --brand: #1f2a44; --accent: #2f5bd3;
      --ok-bg: #e6f6ea; --ok-text: #1a7f37; --err-bg: #fdecea; --err-text: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 20px; padding: 12px 24px;
             background: var(--brand); color: #fff; }
    header a, header button { color: #fff; text-decoration: none; }
    header .brand { font-weight: 700; letter-spacing: .02em; }
    header .spacer { flex: 1; }
    header form { margin: 0; }
    main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 20px 24px; margin-bottom: 20px; }
    .narrow { max-width: 380px; margin: 48px auto; }
    .muted { color: var(--muted); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
             background: #e8eefc; color: var(--accent); font-weight: 600; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { font-size: 13px; color: var(--muted); font-weight: 600; }
    td.check { text-align: center; }
    th.check { text-align: center; }
    label { display: block; margin-bottom: 12px; font-weight: 600; }
    input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
    label input { display: block; width: 100%; margin-top: 4px; font-weight: 400; }
    button { font: inherit; cursor: pointer; padding: 6px 14px; border: 0; border-radius: 6px;
             background: var(--accent); color: #fff; }
    button.link { background: none; padding: 0; }
    form.inline { display: flex; gap: 8px; margin: 0; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .msg-success { background: var(--ok-bg); color: var(--ok-text); }
    .msg-error { background: var(--err-bg); color: var(--err-text); }
    .small { font-size: 13px; }
    .field { margin-bottom: 14px; }
    .field > label { margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; }
    textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .checks div label { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-weight: 400; }
    .checks input[type=checkbox] { width: auto; margin: 0; }
    .errorlist { list-style: none; margin: 4px 0 0; padding: 0; color: var(--err-text); font-size: 13px; }
    .status { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
    .status-todo { background: #eef0f3; color: var(--muted); }
    .status-in_progress { background: #fff4d6; color: #8a5a00; }
    .status-complete { background: var(--ok-bg); color: var(--ok-text); }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <span class="brand">Orion</span>
    <a href="{% url 'home' %}">Home</a>
    {% if is_admin %}<a href="{% url 'manage-users' %}">Manage users</a>{% endif %}
    <span class="spacer"></span>
    <span>{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}<button class="link">Log out</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% for message in messages %}
      <div class="msg msg-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
