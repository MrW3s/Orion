<style>
  /* Read-only chart: no links, buttons or drag handles inside it, for every role. */
  .gantt { overflow-x: auto; }
  .gantt-grid { min-width: calc(260px + {{ chart.days }} * 22px); }
  .gantt-row { display: grid; grid-template-columns: 260px 1fr; align-items: center;
               border-bottom: 1px solid var(--border); min-height: 44px; }
  .gantt-row.head { min-height: 28px; font-size: 12px; color: var(--muted); }
  .gantt-row.mine .gantt-label strong::after { content: " · yours"; color: var(--accent); font-weight: 600; font-size: 12px; }
  .gantt-label { padding: 6px 12px 6px 0; line-height: 1.3; }
  .gantt-label .small { display: block; }
  .gantt-track { position: relative; height: 100%; min-height: 28px; }
  .gantt-tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--border);
                padding-left: 3px; white-space: nowrap; }
  .gantt-bar { position: absolute; top: 9px; bottom: 9px; border-radius: 4px; min-width: 4px;
               background: #b8c3d6; }
  .gantt-bar.status-in_progress { background: #f0b429; }
  .gantt-bar.status-complete { background: #3fa45a; }
  .gantt-bar.critical { box-shadow: inset 0 0 0 2px var(--err-text); }
  .gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--err-text); }
  .gantt-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .gantt-legend span::before { content: ""; display: inline-block; width: 14px; height: 10px;
                               border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  .gantt-legend span.crit::before { box-shadow: inset 0 0 0 2px var(--err-text); }
  .gantt-body { position: relative; }
  .gantt-body .gantt-today-wrap { position: absolute; top: 0; bottom: 0; left: 260px; right: 0; pointer-events: none; }
</style>
