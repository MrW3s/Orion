<style>
  /* Standup page. Shares the variables and .card / .status classes in accounts/base.html. */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .standup-head { align-items: center; }
  .inline-label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-weight: 600; font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 16px; }
  .toolbar .spacer { flex: 1; }
  #custom-range { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #custom-range[hidden] { display: none; }
  .secondary-btn { background: #e8eefc; color: var(--accent); }
  .secondary-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .sec h2 { display: flex; align-items: center; gap: 10px; }
  .sec h2 .actions { margin-left: auto; font-size: 14px; font-weight: 400; }
  .standup-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 0 20px; }
  .standup-grid > div { min-width: 0; }
  @media (max-width: 1024px) { .standup-grid { grid-template-columns: minmax(0, 1fr); } }
  #standup, #standup * { overflow-wrap: anywhere; }

  /* Tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 8px;
          background: var(--bg); color: var(--text); border: 2px solid transparent; min-height: 92px; }
  .tile:hover, .tile:focus-visible { border-color: var(--border); }
  .tile.active { border-color: var(--accent); background: #e8eefc; }
  .tile .label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .tile .count { font-size: 28px; font-weight: 700; line-height: 1.2; }
  .tile .delta { font-size: 13px; }
  .delta.up { color: var(--ok-text); } .delta.down { color: var(--err-text); } .delta.same { color: var(--muted); }
  .delta.bad.up { color: var(--err-text); } .delta.bad.down { color: var(--ok-text); }

  /* Task list */
  .filter-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .task-table td, .task-table th { padding: 8px 6px; }
  .flag { display: inline-block; margin-left: 4px; }

  /* Activity timeline */
  .kind-created { --kind: #2f5bd3; } .kind-in_progress { --kind: #b7791f; } .kind-done { --kind: #1a7f37; }
  .kind-blocked { --kind: #b42318; } .kind-unblocked { --kind: #0e7490; } .kind-reassigned { --kind: #7c3aed; }
  .kind-reopened { --kind: #656d76; } .kind-mixed { --kind: #1f2a44; }
  .timeline-track { position: relative; height: 92px; margin: 8px 14px 0; }
  .timeline-track .axis { position: absolute; left: 0; right: 0; bottom: 4px; border-top: 2px solid var(--border); }
  .marker { position: absolute; transform: translateX(-50%); width: 24px; height: 24px; padding: 0;
            border-radius: 50%; background: var(--kind); color: #fff; font-size: 13px; line-height: 24px;
            text-align: center; }
  .marker:hover, .marker:focus-visible { outline: 3px solid color-mix(in srgb, var(--kind) 35%, transparent); z-index: 3; }
  .marker-count { position: absolute; top: -8px; right: -10px; min-width: 18px; padding: 0 4px;
                  border-radius: 999px; background: var(--surface); color: var(--kind);
                  border: 1px solid var(--kind); font-size: 11px; line-height: 16px; }
  .marker-tip { display: none; position: absolute; top: 30px; left: 0; z-index: 4; width: max-content;
                max-width: 320px; padding: 8px 10px; border-radius: 6px; background: var(--surface);
                color: var(--text); border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,.12);
                text-align: left; font-size: 13px; line-height: 1.5; }
  .marker-tip.to-left { left: auto; right: 0; }
  .marker:hover .marker-tip, .marker:focus .marker-tip { display: block; }
  .ticks { position: relative; height: 20px; margin: 4px 14px 8px; }
  .ticks .tick { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .ticks .tick:first-child { transform: none; } .ticks .tick:last-child { transform: translateX(-100%); }
  @media (max-width: 1024px) { .ticks .tick:nth-child(2), .ticks .tick:nth-child(4) { display: none; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
  .legend li, .marker-tip div { display: flex; align-items: center; gap: 6px; }
  .swatch { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--kind);
            color: #fff; font-size: 11px; line-height: 18px; text-align: center; flex: none; }

  /* Person cards */
  .people { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .person { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface);
            cursor: grab; scroll-margin: 80px; }
  .person.idle { background: var(--bg); }
  .person.drop-target { border-color: var(--accent); border-style: dashed; }
  .person.speaking { border: 2px solid var(--accent); box-shadow: 0 0 0 4px #e8eefc; }
  .person-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .person-head .grip { color: var(--muted); letter-spacing: -2px; }
  .order-buttons { margin-left: auto; display: flex; gap: 6px; }
  .order-buttons button { color: var(--accent); font-size: 16px; }
  .order-buttons button:disabled { color: var(--border); cursor: default; }
  .person-list ul { margin: 2px 0 8px; padding-left: 18px; }
  .person .reason { color: #9a3412; }
  .sec h2 .hint { margin-right: 8px; }
  @media (max-width: 1024px) { .sec h2 .hint { display: none; } }

  /* Loading, empty and error states */
  .skeleton { background: linear-gradient(90deg, #eef0f3 25%, #f7f8fa 50%, #eef0f3 75%);
              background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; }
  .skeleton-lines .skeleton { height: 14px; margin: 10px 0; }
  .skeleton-lines .skeleton.short { width: 60%; }
  .tile.skeleton { border: 0; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
  .empty { color: var(--muted); margin: 4px 0; }
  .sec-error { display: flex; gap: 12px; align-items: center; }

  /* Present mode: no nav, bigger text, for the screen everyone is looking at */
  body.present > header, body.present .msg-success { display: none; }
  body.present main { max-width: none; padding: 0 24px; margin-top: 16px; }
  body.present #standup { font-size: 19px; }
  body.present #standup h1 { font-size: 30px; }
  body.present #standup h2 { font-size: 22px; }
  body.present .tile .count { font-size: 40px; }
  body.present .tile .label, body.present .tile .delta, body.present #standup .small { font-size: 16px; }
</style>
